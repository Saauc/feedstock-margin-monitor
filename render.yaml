# Render blueprint — one-click deploy of the live dashboard.
# In Render: New → Blueprint → connect this repo. Render reads this file and
# provisions the web service automatically. No secrets required: the dashboard
# is read-only over the committed feedstock.db and recomputes everything
# client-side, so it needs no API keys to serve.
services:
  - type: web
    name: feedstock-margin-monitor
    runtime: python
    plan: free
    buildCommand: "pip install -e . gunicorn"
    # --timeout 120: the first request after a cold start/deploy computes and
    # caches the full page (a few seconds locally, more on a throttled free
    # CPU) — give it headroom past gunicorn's 30s default so that request
    # doesn't get killed mid-render. Every request after is served from cache.
    startCommand: "gunicorn feedstock.app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1"
    healthCheckPath: /healthz
    autoDeploy: true
