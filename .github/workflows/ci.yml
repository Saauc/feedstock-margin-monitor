name: CI

# Runs on every push and PR — separate from the daily data job (daily.yml).
# This is the quality gate: lint, type-check, and the full test suite.
on:
  push:
    branches: ["**"]
  pull_request: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install (with dev tools)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy src

      - name: Tests (pytest)
        run: pytest -q
